plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.picsortertrash'
version = '1.0.0'

android {
  namespace "expo.modules.picsortertrash"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.activity:activity-ktx:1.11.0'
}
